[project]
name = "boosted-baron"
version = "0.1.0"
description = "Oracle of the Rift: League of Legends match data pipeline and prediction bot (learning project)."
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
]

[project.scripts]
oracle = "oracle.cli:main"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "oracle"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

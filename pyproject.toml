[project]
name = "boosted-baron"
version = "0.1.0"
description = "Oracle of the Rift: League of Legends match data pipeline and prediction bot (learning project)."
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
]

[project.scripts]
oracle = "oracle.cli:main"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "oracle"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
bot = [
    "discord-py>=2.7.1",
    "joblib>=1.6.0",
    "scikit-learn>=1.9.1",
]
dev = [
    "pytest>=9.1.1",
]
training = [
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.5",
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.2",
    "scikit-learn>=1.9.1",
    "shap>=0.54.1",
]
